databases:
  - name: loom-db-demo
    plan: free
    databaseName: loom
    user: loom_user

services:
  - type: web
    name: loom-backend-demo
    env: python
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && alembic downgrade base && alembic upgrade head && python scripts/seed_demo.py && uvicorn core.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: loom-db-demo
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.0